exp_name: smgeo
save_dir: /media/data1/feihong/ckpt/ground_sm

model:
  type: smgeo
  pretrained_checkpoint: /media/data1/feihong/ckpt/SMGeo.pth
  num_experts: 6
  top_k: 2
  use_angle: true
  use_heatmap: false
  use_text: false

train:
  batch_size: 32

loss:
  heatmap_weight: 0.7
  bbox_weight: 0.3
  smgeo_heatmap_sigma: 2.0
  moe_entropy_weight: 0.005

query_guard:
  enabled: true
  projection_dim: 256
  temperature: 0.07
  weight: 0.2
  warmup_epochs: 2
  center_weight: 0.7
  identity_key: object_id

eval:
  output_dir: eval_results/grounding/smgeo
