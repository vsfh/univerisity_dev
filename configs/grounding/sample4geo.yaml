exp_name: sample4geo
save_dir: /media/data1/feihong/ckpt/ground_sample

model:
  type: sample4geo
  pretrained_checkpoint: /media/data1/feihong/ckpt/Sample4Geo.pth
  use_angle: true
  use_heatmap: false
  use_text: false

train:
  batch_size: 24

query_guard:
  enabled: true
  projection_dim: 256
  temperature: 0.07
  weight: 0.2
  warmup_epochs: 2
  center_weight: 0.7
  identity_key: object_id

eval:
  output_dir: eval_results/grounding/sample4geo
