exp_name: det
save_dir: /media/data1/feihong/ckpt/ground_det

model:
  type: det
  pretrained_checkpoint: /media/data1/feihong/ckpt/yolov3.weights
  darknet_config: /media/data1/feihong/ckpt/yolov3_rs.cfg
  load_reference_weights: true
  use_angle: true
  use_heatmap: false
  use_text: false

train:
  batch_size: 30

query_guard:
  enabled: true
  projection_dim: 256
  temperature: 0.07
  weight: 0.2
  warmup_epochs: 2
  center_weight: 0.7
  identity_key: object_id

eval:
  output_dir: eval_results/grounding/det
